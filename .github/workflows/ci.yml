name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check scripts tests
      - name: Validate data
        run: python scripts/validate.py
      - name: Tests
        run: pytest
      - name: README tables (en + zh) are up to date
        run: python scripts/build.py --check
