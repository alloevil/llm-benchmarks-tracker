name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell search engines to recrawl (IndexNow) after the site is deployed, using
  # the freshly published sitemap. Advisory: a non-2xx or network error must
  # never fail the pipeline.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request
          KEY = "8ed96c1ebbc0415f1c2de0feb52bbf92c484e7ce0de0b00a"
          KEY_LOCATION = "https://alloevil.github.io/8ed96c1ebbc0415f1c2de0feb52bbf92c484e7ce0de0b00a.txt"
          SITEMAP = "https://alloevil.github.io/llm-benchmarks-tracker/sitemap.xml"
          xml = urllib.request.urlopen(SITEMAP, timeout=30).read().decode()
          urls = re.findall(r"<loc>(.*?)</loc>", xml)
          host = urllib.parse.urlsplit(urls[0]).netloc
          payload = {"host": host, "key": KEY, "keyLocation": KEY_LOCATION, "urlList": urls}
          req = urllib.request.Request("https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("IndexNow:", resp.status, resp.read().decode() or "(no body)")
          except Exception as e:
              print("IndexNow ping failed (advisory, ignoring):", e)
          PY
