name: sync

on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Append new top scores from allow-listed sources
        id: sync
        run: |
          set +e
          python scripts/sync_ledgers.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Regenerate README tables
        if: steps.sync.outputs.code != '1'
        run: python scripts/build.py
      - name: Validate and test
        if: steps.sync.outputs.code != '1'
        run: python scripts/validate.py && pytest -q
      - name: Commit and push
        if: steps.sync.outputs.code != '1'
        run: |
          git config user.name "ledger-sync[bot]"
          git config user.email "ledger-sync@users.noreply.github.com"
          git add data/results README.md README.zh-CN.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: sync ledgers from official/independent sources" -m "$(cat sync_summary.md)"
          git push
      - name: Open tooling issue if a source could not be parsed
        if: steps.sync.outputs.code == '2'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Ledger sync: source parse failure"
          content-filepath: sync_summary.md
          labels: tooling, automated
