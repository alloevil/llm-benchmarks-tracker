<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">LLM Benchmarks Tracker</title>
  <desc id="heroDesc">Sourced, schema-validated catalogue of LLM and agent benchmarks. A results ledger row for ARC-AGI-2: system GPT-6 Astra (Max), value 95.0, date 2026-09-02, source.kind official-leaderboard, source.accessed 2026-09-04, metric.unit percent, conditions.split Semi-Private. Below it, the five source.kind provenance labels the catalogue uses: official-leaderboard, paper, independent-evaluation, developer-report, aggregator.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#0b0e14"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="23.5" fill="none" stroke="#232a36" stroke-width="1.5"/>

  <g id="title-block">
    <text x="64" y="64" class="mono" font-size="18" letter-spacing="2" fill="#7aa2f7">SOURCED, SCHEMA-VALIDATED CATALOGUE</text>
    <text x="64" y="120" class="sans" font-size="50" font-weight="700" fill="#e6e9ef">LLM Benchmarks Tracker</text>
    <text x="64" y="152" class="sans" font-size="20" fill="#8a94a6">What each benchmark tests, and where a quoted score actually came from.</text>
  </g>

  <g id="ledger-card">
    <rect x="64" y="170" width="1072" height="158" rx="14" fill="#121721" stroke="#232a36" stroke-width="1.5"/>
    <text x="96" y="204" class="sans" font-size="20" font-weight="700" fill="#e6e9ef">results ledger row</text>
    <text x="1104" y="202" class="mono" font-size="18" fill="#8a94a6" text-anchor="end">data/results/arc-agi-2.json  &#183;  schema/results.schema.json</text>

    <text x="96" y="240" class="mono" font-size="20"><tspan fill="#8a94a6">system = </tspan><tspan fill="#e6e9ef">GPT-6 Astra (Max)</tspan></text>
    <text x="600" y="240" class="mono" font-size="20"><tspan fill="#8a94a6">value = </tspan><tspan fill="#7aa2f7" font-weight="700">95.0</tspan></text>
    <text x="840" y="240" class="mono" font-size="20"><tspan fill="#8a94a6">metric.unit = </tspan><tspan fill="#e6e9ef">percent</tspan></text>

    <text x="96" y="278" class="mono" font-size="20"><tspan fill="#8a94a6">date = </tspan><tspan fill="#e6e9ef">2026-09-02</tspan></text>
    <text x="600" y="278" class="mono" font-size="20"><tspan fill="#8a94a6">source.kind = </tspan><tspan fill="#9ece6a">official-leaderboard</tspan></text>

    <text x="96" y="316" class="mono" font-size="20"><tspan fill="#8a94a6">source.accessed = </tspan><tspan fill="#e6e9ef">2026-09-04</tspan></text>
    <text x="600" y="316" class="mono" font-size="20"><tspan fill="#8a94a6">conditions.split = </tspan><tspan fill="#e6e9ef">Semi-Private</tspan></text>
  </g>

  <g id="provenance-legend">
    <text x="64" y="358" class="mono" font-size="18"><tspan fill="#e6e9ef">source.kind</tspan><tspan fill="#8a94a6">  &#183;  carried by every result row</tspan></text>

    <rect x="64" y="364" width="245" height="32" rx="16" fill="#9ece6a" fill-opacity="0.12" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="78" y="385" class="mono" font-size="18" fill="#9ece6a">official-leaderboard</text>

    <rect x="325" y="364" width="85" height="32" rx="16" fill="#121721" stroke="#232a36" stroke-width="1.5"/>
    <text x="339" y="385" class="mono" font-size="18" fill="#7aa2f7">paper</text>

    <rect x="426" y="364" width="280" height="32" rx="16" fill="#121721" stroke="#232a36" stroke-width="1.5"/>
    <text x="440" y="385" class="mono" font-size="18" fill="#9ece6a">independent-evaluation</text>

    <rect x="722" y="364" width="211" height="32" rx="16" fill="#121721" stroke="#232a36" stroke-width="1.5"/>
    <text x="736" y="385" class="mono" font-size="18" fill="#e0af68">developer-report</text>

    <rect x="949" y="364" width="143" height="32" rx="16" fill="#121721" stroke="#232a36" stroke-width="1.5"/>
    <text x="963" y="385" class="mono" font-size="18" fill="#8a94a6">aggregator</text>
  </g>
</svg>
