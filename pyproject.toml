[project]
name = "llm-benchmarks-tracker"
version = "1.0.0"
description = "Sourced, schema-validated catalogue of LLM and agent evaluation benchmarks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://alloevil.github.io/llm-benchmarks-tracker/"
Repository = "https://github.com/alloevil/llm-benchmarks-tracker"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
required-version = ">=0.5"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
